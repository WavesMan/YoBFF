            application/json:
              schema:
                $ref: "#/components/schemas/WeaverDeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/WeaverDraftNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
  /api/v1/weaver/node-contracts:
    get:
      summary: 获取 Weaver 节点契约目录
      description: 返回可用于编排编辑器选择的节点契约模板集合。
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeaverNodeContractCatalogResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
  /api/v1/weaver/drafts/{draft_id}/validate:
    parameters:
      - in: path
        name: draft_id
        schema:
          type: string
        required: true
        description: 草稿标识
    post:
      summary: 校验 Weaver 草稿 DAG
      description: 校验草稿 DAG 结构并返回拓扑冻结后的节点契约，可在请求体中覆盖 DAG。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeaverDraftValidateRequest"
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeaverDraftValidateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/WeaverDraftNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
  /api/v1/weaver/drafts/{draft_id}/run:
    parameters:
      - in: path
        name: draft_id
        schema:
          type: string
        required: true
        description: 草稿标识
    post:
      summary: 运行 Weaver 草稿
      description: 使用草稿内输入与映射进行试跑，也可在请求体覆盖输入或映射。
      parameters:
        - in: header
          name: X-Operator
          schema:
            type: string
          required: false
          description: 操作人标识，未提供时自动回退到登录用户
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeaverRunRequest"
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeaverRunResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/WeaverDraftNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
  /api/v1/weaver/runs/stats:
    get:
      summary: 获取 Weaver 最近运行统计
      description: 返回最近 N 次运行的错误码分组统计与趋势数据，用于策略效果观测。
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 20
          required: false
          description: 返回最近运行条数上限
        - in: query
          name: scope
          schema:
            type: string
            enum:
              - draft
              - version
          required: false
          description: 统计维度，仅在与 target_id 同时提供时生效
        - in: query
          name: target_id
          schema:
            type: string
          required: false
          description: 维度目标ID，草稿或版本标识
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeaverRunStatsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
  /api/v1/weaver/drafts/{draft_id}/publish:
    parameters:
      - in: path
        name: draft_id
        schema:
          type: string
        required: true
        description: 草稿标识
    post:
      summary: 发布 Weaver 草稿
      description: 将草稿发布为可追踪的流程版本，并冻结节点接口契约。
      parameters:
        - in: header
          name: X-Operator
          schema:
            type: string
          required: false
          description: 操作人标识，未提供时自动回退到登录用户
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeaverVersion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/WeaverDraftNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
  /api/v1/weaver/drafts/{draft_id}/versions:
    parameters:
      - in: path
        name: draft_id
        schema:
          type: string
        required: true
        description: 草稿标识
    get:
      summary: 获取 Weaver 草稿版本列表
      description: 返回指定草稿的发布版本快照，按版本号倒序排列。
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 20
          required: false
          description: 返回条数上限
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeaverVersionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
  /api/v1/weaver/versions/{version_id}:
    parameters:
      - in: path
        name: version_id
        schema:
          type: string
        required: true
        description: 流程版本标识
    get:
      summary: 获取 Weaver 流程版本详情
      description: 返回发布版本的冻结输入、映射、DAG 与节点契约。
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeaverVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/VersionNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
  /api/v1/weaver/versions/{version_id}/run:
    parameters:
      - in: path
        name: version_id
        schema:
          type: string
        required: true
        description: 流程版本标识
    post:
      summary: 运行 Weaver 流程版本
      description: 使用冻结版本执行 DAG，允许覆盖运行 inputs。
      parameters:
        - in: header
          name: X-Operator
          schema:
            type: string
          required: false
          description: 操作人标识，未提供时自动回退到登录用户
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeaverRunRequest"
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeaverRunResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/VersionNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  headers:
    RequestID:
      description: 请求追踪标识
      schema:
        type: string
    RateLimitLimit:
      description: 当前时间窗口最大请求数
      schema:
        type: integer
        format: int32
    RateLimitRemaining:
      description: 当前窗口剩余请求数
      schema:
        type: integer
        format: int32
    RateLimitReset:
      description: 窗口重置时间戳
      schema:
        type: integer
        format: int64
  responses:
    BadRequest:
      description: 请求非法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 鉴权失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: 触发限流
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: 服务内部错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AuthUnavailable:
      description: 鉴权未配置
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    CaptchaUnavailable:
      description: 验证码服务不可用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    MethodNotAllowed:
      description: 请求方法不允许
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationFailed:
      description: 配置预检失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
    LBPoolNotFound:
      description: 流量池不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error_code: pool_not_found
            message: pool not found
            request_id: req-123456
    LBRouteNotFound:
      description: 域名绑定规则不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error_code: route_not_found
            message: route not found
            request_id: req-123456
    SiteNotFound:
      description: 站点不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error_code: site_not_found
            message: site not found
            request_id: req_109238475a
    VersionNotFound:
      description: 站点配置版本不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error_code: version_not_found
            message: version not found
            request_id: req_109238475b
    LogStreamNotFound:
      description: 站点日志流配置不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error_code: log_stream_not_found
            message: log stream not found
            request_id: req_109238475c
    WeaverDraftNotFound:
      description: Weaver 草稿不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error_code: draft_not_found
            message: weaver draft not found
            request_id: req_109238475w
  schemas:
    ErrorResponse:
      type: object
      required:
        - error_code
        - message
        - request_id
      properties:
        error_code:
          type: string
        message:
          type: string
        request_id:
          type: string
    AuditLogEntry:
      type: object
      required:
        - id
        - action
        - created_at
      properties:
        id:
          type: string
        action:
          type: string
        target:
          type: string
        created_at:
          type: string
          format: date-time
        operator:
          type: string
        detail:
          type: string
    AuditLogListResponse:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
        total:
          type: integer
          format: int64
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
    WeaverInputPayload:
      type: object
      required:
        - name
        - payload
      properties:
        name:
          type: string
        payload:
          type: object
          additionalProperties: true
    WeaverDraftRequest:
      type: object
      required:
        - name
        - inputs
        - mapping
      properties:
        name:
          type: string
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/WeaverInputPayload"
        mapping:
          type: object
          additionalProperties: true
        dag:
          $ref: "#/components/schemas/WeaverDAG"
    WeaverDraft:
      type: object
      required:
        - id
        - name
        - inputs
        - mapping
        - created_at
        - updated_at
      properties:
        id:
          type: string
        name:
          type: string
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/WeaverInputPayload"
        mapping:
          type: object
          additionalProperties: true
        dag:
          $ref: "#/components/schemas/WeaverDAG"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        operator:
          type: string
    WeaverDraftListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WeaverDraft"
    WeaverDraftValidateRequest:
      type: object
      properties:
        dag:
          $ref: "#/components/schemas/WeaverDAG"
    WeaverDraftValidateResponse:
      type: object
      required:
        - status
        - draft_id
        - node_contracts
      properties:
        status:
          type: string
          enum:
            - valid
        draft_id:
          type: string
        node_contracts:
          type: array
          items:
            $ref: "#/components/schemas/WeaverNodeContract"
    WeaverRunRequest:
      type: object
      properties:
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/WeaverInputPayload"
        mapping:
          type: object
          additionalProperties: true
        dag:
          $ref: "#/components/schemas/WeaverDAG"
        retry:
          $ref: "#/components/schemas/WeaverRunRetryPolicy"
    WeaverRunSource:
      type: object
      required:
        - name
        - ok
      properties:
        name:
          type: string
        ok:
          type: boolean
        code:
          type: string
        error:
          type: string
    WeaverRunRetryPolicy:
      type: object
      properties:
        max_attempts:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
        retry_on_node_error:
          type: boolean
        retry_on_source_error:
          type: boolean
        retryable_codes:
          type: array
          items:
            type: string
        backoff_initial_ms:
          type: integer
          format: int32
          minimum: 0
        backoff_multiplier:
          type: number
          format: double
          minimum: 1
        backoff_max_ms:
          type: integer
          format: int32
          minimum: 0
    WeaverRunRetrySnapshot:
      type: object
      required:
        - max_attempts
        - used
        - triggered
        - retryable_codes
        - backoff_initial_ms
        - backoff_multiplier
        - backoff_max_ms
        - delays_ms
      properties:
        max_attempts:
          type: integer
          format: int32
        used:
          type: integer
          format: int32
        triggered:
          type: boolean
        retryable_codes:
          type: array
          items:
            type: string
        backoff_initial_ms:
          type: integer
          format: int32
        backoff_multiplier:
          type: number
          format: double
        backoff_max_ms:
          type: integer
          format: int32
        delays_ms:
          type: array
          items:
            type: integer
            format: int64
    WeaverRunFailure:
      type: object
      required:
        - scope
        - code
        - attempt
        - error
        - retryable
      properties:
        scope:
          type: string
          enum:
            - source
            - node
            - dag
        code:
          type: string
        node_id:
          type: string
        source:
          type: string
        attempt:
          type: integer
          format: int32
        error:
          type: string
        retryable:
          type: boolean
    WeaverRunNodeExecution:
      type: object
      required:
        - node_id
        - node_type
        - attempt
        - status
        - duration_ms
        - input_keys
        - parent_nodes
        - output_keys
      properties:
        node_id:
          type: string
        node_type:
          type: string
        attempt:
          type: integer
          format: int32
        status:
          type: string
          enum:
            - succeeded
            - failed
        duration_ms:
          type: integer
          format: int64
        input_keys:
          type: array
          items:
            type: string
        parent_nodes:
          type: array
          items:
            type: string
        output_keys:
          type: array
          items:
            type: string
        error:
          type: string
    WeaverRunAttempt:
      type: object
      required:
        - attempt
        - status
        - duration_ms
        - node_executions
      properties:
        attempt:
          type: integer
          format: int32
        status:
          type: string
          enum:
            - succeeded
            - failed
        duration_ms:
          type: integer
          format: int64
        node_executions:
          type: array
          items:
            $ref: "#/components/schemas/WeaverRunNodeExecution"
        failure:
          $ref: "#/components/schemas/WeaverRunFailure"
    WeaverRunResponse:
      type: object
      required:
        - run_id
        - status
        - output
        - duration_ms
        - sources
        - attempts
        - failures
        - retry
      properties:
        run_id:
          type: string
        status:
          type: string
          enum:
            - succeeded
            - failed
        output:
          type: object
          additionalProperties: true
        duration_ms:
          type: integer
          format: int64
        sources:
          type: array
          items:
            $ref: "#/components/schemas/WeaverRunSource"
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/WeaverRunAttempt"
        failures:
          type: array
          items:
            $ref: "#/components/schemas/WeaverRunFailure"
        retry:
          $ref: "#/components/schemas/WeaverRunRetrySnapshot"
    WeaverRunErrorGroup:
      type: object
      required:
        - code
        - count
      properties:
        code:
          type: string
        count:
          type: integer
          format: int32
    WeaverRunTrendPoint:
      type: object
      required:
        - run_id
        - created_at
        - status
        - duration_ms
        - attempts_used
        - error_codes
      properties:
        run_id:
          type: string
        created_at:
          type: string
        status:
          type: string
          enum:
            - succeeded
            - failed
        duration_ms:
          type: integer
          format: int64
        attempts_used:
          type: integer
          format: int32
        error_codes:
          type: array
          items:
            type: string
    WeaverRunStatsResponse:
      type: object
      required:
        - limit
        - total_runs
        - success_runs
        - failed_runs
        - error_groups
        - trends
      properties:
        limit:
          type: integer
          format: int32
        scope:
          type: string
          enum:
            - draft
            - version
        target_id:
          type: string
        total_runs:
          type: integer
          format: int32
        success_runs:
          type: integer
          format: int32
        failed_runs:
          type: integer
          format: int32
        error_groups:
          type: array
          items:
            $ref: "#/components/schemas/WeaverRunErrorGroup"
        trends:
          type: array
          items:
            $ref: "#/components/schemas/WeaverRunTrendPoint"
    WeaverDeleteResponse:
      type: object
      required:
        - status
        - id
      properties:
        status:
          type: string
          enum:
            - deleted
        id:
          type: string
    WeaverDAGNode:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
        type:
          type: string
        inputs:
          type: array
          items:
            type: string
        outputs:
          type: array
          items:
            type: string
        config:
          type: object
          additionalProperties: true
